# --- Set Prefix ---
set -g prefix C-b
bind C-b send-prefix

# --- Neovim needs these ---
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
bind C-b send-prefix

# --- Quality of life ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
bind Tab last-window

# --- Vi copy mode + clipboard ---
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Splits that open in the current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Vim-style pane movement ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resizing (repeatable) ---
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# --- Reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- Statusline: Gruvbox Material ---
set -g status-style "bg=#32302f,fg=#d4be98"
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=#ea6962],#[bg=#a9b665]}#[fg=#282828,bold] #S #[default] "
set -g status-right ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#d8a657,fg=#282828,bold] #I #W "

set -g pane-border-style "fg=#45403d"
set -g pane-active-border-style "fg=#d8a657"
set -g message-style "bg=#32302f,fg=#d8a657"
setw -g mode-style "bg=#45403d"
